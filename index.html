<!DOCTYPE html>
<html>
<body>

<h2>String Tapşırıqları</h2>

<script>

    let text = prompt("Mətni daxil edin:");

    console.log("1. Uzunluğu:", text.length);
    console.log("2. 'e' hərfi var?:", text.includes("e"));
    console.log("3. 'code' ilə başlayır?:", text.startsWith("code"));
    console.log("4. 'code' ilə bitir?:", text.endsWith("code"));
    console.log("5. 't' hərfləri dəyişdi:", text.replaceAll("t", "####"));
</script>

</body>
</html>
